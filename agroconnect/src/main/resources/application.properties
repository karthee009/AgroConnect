spring.application.name=agroconnect

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agroconnectdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT:8080}
# Uploaded loan documents: configure persistent storage for deployment.
agroconnect.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Official daily mandi prices from data.gov.in / AGMARKNET. Keep the key outside source control.
agroconnect.market-data.api-key=${DATA_GOV_IN_API_KEY:}
